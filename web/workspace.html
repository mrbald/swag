<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio workspace</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#e7edf2;color:#183248;font:14px system-ui;display:flex;flex-direction:column;overflow:hidden}
header{height:58px;flex-shrink:0;background:#142c42;color:white;display:flex;align-items:center;gap:18px;padding:0 22px}
header strong{font-size:18px}#user{margin-left:auto}button{font:inherit;border:1px solid #b6c7d2;border-radius:4px;padding:7px 14px;cursor:pointer;background:white;color:#183248}button:disabled{opacity:.5;cursor:default}
#bar{display:flex;flex-wrap:wrap;flex-shrink:0;align-items:center;gap:12px;padding:12px 22px;background:white;border-bottom:1px solid #c5d1da}#status{flex:1;min-width:180px}
#screen{margin:14px 16px;flex:1;min-width:0;min-height:0;background:#263b4b;overflow:hidden;border-radius:4px}
#clipboard{width:260px;font:inherit;padding:7px;border:1px solid #b6c7d2;border-radius:4px}#empty{color:#dbe6ee;display:grid;place-items:center;height:100%;font-size:18px}
</style></head>
<body><header><strong>Portfolio workspace</strong><span>Implementation lab</span><span id="user"></span><button id="signout">End session &amp; sign out</button></header>
<div id="bar"><span id="status" role="status">Checking session…</span><button id="start" disabled>Start workspace</button><input id="clipboard" aria-label="Clipboard text" placeholder="Clipboard text"><button id="paste">Send clipboard</button></div>
<main id="screen"><div id="empty">Your workspace will appear here.</div></main>
<script type="module">
import RFB from './core/rfb.js';
let session=null, rfb=null, connectedGeneration=null, stopped=false, busy=false;
let signingOut=false, polling=false, revision=0;
const $=id=>document.getElementById(id);
const loginURL='/oauth2/start?rd=/';
class ObsoleteRequest extends Error {}
class LoginExpired extends Error {}
function status(text){$('status').textContent=text;}
function resizeMode(current=rfb){
  if(!current)return;
  const {width,height}=$('screen').getBoundingClientRect();
  // Below a usable desktop size, scale the existing framebuffer in full.
  const remote=width>=800&&height>=600;
  if(current.resizeSession!==remote)current.resizeSession=remote;
}
// Install before RFB's own observer, so shrinking below the floor disables
// remote resizing before it can request an unusably small framebuffer.
const resizeObserver=new ResizeObserver(()=>resizeMode());resizeObserver.observe($('screen'));
addEventListener('resize',()=>resizeMode());
function disconnect(){if(rfb){const old=rfb;rfb=null;old.disconnect();}connectedGeneration=null;}
function report(error){if(!(error instanceof ObsoleteRequest)&&!(error instanceof LoginExpired)&&!signingOut)status(error.message);}
async function api(method='GET',path='/session',body){
  const startedAt=revision;
  const headers={};if(method!=='GET'){headers['X-Swag-CSRF']=session?.csrf_token||'';headers['Content-Type']='application/json';}
  const response=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),redirect:'error',cache:'no-store'});
  if(startedAt!==revision)throw new ObsoleteRequest();
  if(response.status===401){stopped=true;disconnect();status('Login expired. Sign in again.');$('start').textContent='Sign in';$('start').disabled=false;throw new LoginExpired();}
  if(!response.ok)throw new Error(`Request failed (${response.status})`);
  const result=await response.json();
  if(startedAt!==revision)throw new ObsoleteRequest();
  return result;
}
function attach(){
  if(stopped||rfb||session?.state!=='running')return;
  $('empty')?.remove();connectedGeneration=session.generation;
  const socket=`${location.protocol==='https:'?'wss':'ws'}://${location.host}/viewer/${encodeURIComponent(session.generation)}/websockify`;
  const current=rfb=new RFB($('screen'),socket,{shared:true});current.scaleViewport=true;resizeMode(current);
  current.addEventListener('connect',()=>{if(rfb===current){status('Connected');show();}});
  current.addEventListener('disconnect',()=>{if(rfb===current){rfb=null;status('Viewer disconnected. Rejoin to take control.');$('start').textContent='Rejoin workspace';$('start').disabled=false;}});
  current.addEventListener('clipboard',event=>{$('clipboard').value=event.detail.text;});
}
function show(){
  $('user').textContent=session.user;
  if(session.state==='running'){
    if(!rfb){$('start').textContent='Rejoin workspace';$('start').disabled=false;}
    else{$('start').textContent='Workspace running';$('start').disabled=true;}
  }else if(session.state==='starting'){
    status('Starting workspace…');$('start').disabled=true;
  }else{
    disconnect();status(session.state==='ended'?'Workspace ended. Start explicitly to open another.':'Ready to start your workspace.');
    $('start').textContent='Start workspace';$('start').disabled=false;
  }
}
function acceptSession(next){
  const recovered=stopped;
  const changed=session&&(session.user!==next.user||session.generation!==next.generation);
  if(changed)disconnect();
  session=next;stopped=false;show();
  if((recovered||changed)&&session.state==='running'&&!rfb)status('Workspace running. Rejoin to take control.');
}
async function refreshSession(){
  if(signingOut||busy||polling)return;
  polling=true;
  try{acceptSession(await api());}catch(error){report(error);}finally{polling=false;}
}
$('start').onclick=async()=>{
  if(stopped){location.href=loginURL;return;}if(busy||signingOut)return;busy=true;revision++;$('start').disabled=true;
  try{acceptSession(await api('POST'));attach();}catch(error){report(error);$('start').disabled=false;}finally{busy=false;}
};
$('paste').onclick=()=>rfb?.clipboardPasteFrom($('clipboard').value);
$('signout').onclick=async()=>{
  if(busy||signingOut)return;busy=true;signingOut=true;revision++;disconnect();status('Signing out…');
  try{await api('DELETE');stopped=true;disconnect();location.href='/oauth2/sign_out?rd=/signed-out';}
  catch(error){signingOut=false;busy=false;report(error);}
};
// A page restored from browser history must revalidate its login and CSRF state.
addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
addEventListener('focus',()=>{if(stopped)void refreshSession();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stopped)void refreshSession();});
try{acceptSession(await api());attach();}catch(error){report(error);}
// Continue checking after a 401: another tab may have completed login meanwhile.
setInterval(refreshSession,3000);
setInterval(async()=>{
  if(stopped||signingOut||!rfb||!connectedGeneration)return;
  try{await api('POST','/session/lease',{generation:connectedGeneration});}catch(error){if(error instanceof ObsoleteRequest)return;disconnect();report(error);}
},10000);
</script></body></html>
