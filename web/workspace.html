<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio workspace</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}body{margin:0;background:#263b4b;color:#183248;font:13px system-ui;overflow:hidden}
button,input{font:inherit}button{border:1px solid #b6c7d2;border-radius:3px;padding:3px 9px;min-height:28px;cursor:pointer;background:white;color:#183248}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #1976d2;outline-offset:2px}
#workspace{position:relative;display:flex;flex-direction:column;height:100%;width:100%;overflow:hidden;background:#263b4b}
#bar{height:36px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:3px 8px;background:#edf2f6;border-bottom:1px solid #bccbd6;z-index:10}
#brand{font-size:13px}#status{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#screen{flex:1;min-width:0;min-height:0;overflow:hidden}
.panel{position:absolute;right:8px;top:40px;z-index:30;width:min(380px,calc(100% - 16px));padding:14px;background:white;border:1px solid #b6c7d2;border-radius:5px;box-shadow:0 4px 20px #102c4250}
.panel h2{font-size:14px;margin:0 0 10px}.panel p{font-size:12px;margin:8px 0;color:#40566a}.panel .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}#clipboard{width:100%;padding:7px;border:1px solid #7e96aa;border-radius:3px}#signout{width:100%;text-align:left}
#empty{color:#dbe6ee;display:grid;place-items:center;height:100%;font-size:18px;padding:16px;text-align:center}#reveal{display:none}
#workspace:fullscreen{width:100vw;height:100vh}#workspace:fullscreen #screen{flex:none;position:absolute;inset:0}
#workspace:fullscreen #bar{position:absolute;inset:0 0 auto;height:36px;transform:translateY(-100%);transition:transform .12s}
#workspace:fullscreen.controls-visible #bar,#workspace:fullscreen #bar:focus-within{transform:translateY(0)}
#workspace:fullscreen #reveal{display:block;position:absolute;z-index:20;top:0;left:50%;transform:translateX(-50%);height:28px;min-width:88px;border-radius:0 0 5px 5px;background:#edf2f6e8}
#workspace:fullscreen.controls-visible #reveal{visibility:hidden}
@media(max-width:700px){#brand{display:none}#bar{gap:4px;padding-inline:4px}#bar button{padding-inline:6px}}
@media(prefers-reduced-motion:reduce){#workspace:fullscreen #bar{transition:none}}
</style></head>
<body><div id="workspace">
<div id="bar" role="toolbar" aria-label="Workspace controls"><strong id="brand">Portfolio</strong><span id="status" role="status">Checking session…</span><button id="start" disabled>Start workspace</button><button id="clipboard-toggle" aria-expanded="false" aria-controls="clipboard-panel" disabled>Clipboard</button><button id="fullscreen" title="Enter full screen">Full screen</button><button id="account-toggle" aria-expanded="false" aria-controls="account-panel" aria-label="Account and session"><span id="user">Account</span> ▾</button></div>
<button id="reveal" aria-controls="bar" aria-expanded="false" title="Show workspace controls">Controls ▾</button>
<section id="clipboard-panel" class="panel" role="dialog" aria-label="Clipboard" hidden><h2>Clipboard</h2><input id="clipboard" aria-label="Clipboard text" placeholder="Text to send or received from Qt"><p>Send text here, then paste inside the application with Ctrl+V. Copied application text appears here.</p><div class="actions"><button id="paste">Send clipboard</button><button id="clipboard-close">Close</button></div></section>
<section id="account-panel" class="panel" role="dialog" aria-label="Account and session" hidden><h2>Session</h2><button id="signout">End session &amp; sign out</button><p>Ends this workspace, including unsaved edits. Identity-provider sign-in may remain active.</p><div class="actions"><button id="account-close">Close</button></div></section>
<main id="screen"><div id="empty">Your workspace will appear here.</div></main>
</div>
<script type="module">
import RFB from './core/rfb.js';
let session=null, rfb=null, connectedGeneration=null, stopped=false, busy=false;
let signingOut=false, polling=false, revision=0;
let viewerConnected=false, needsAttention=true, hideTimer=null, panel=null;
const $=id=>document.getElementById(id);
const loginURL='/oauth2/start?rd=/';
class ObsoleteRequest extends Error {}
class LoginExpired extends Error {}
function fullscreen(){return document.fullscreenElement===$('workspace');}
function status(text,attention=!viewerConnected){$('status').textContent=text;$('status').title=text;needsAttention=attention;if(attention)revealControls();}
function focusCanvas(){if(viewerConnected)rfb?.focus();}
function scheduleHide(){
  clearTimeout(hideTimer);
  if(!fullscreen())return;
  hideTimer=setTimeout(()=>{
    if(!viewerConnected||needsAttention||panel||$('bar').matches(':hover')||$('bar').contains(document.activeElement))return;
    $('workspace').classList.remove('controls-visible');$('reveal').setAttribute('aria-expanded','false');
  },1800);
}
function revealControls(){$('workspace').classList.add('controls-visible');$('reveal').setAttribute('aria-expanded','true');scheduleHide();}
function closePanel(focus=false){
  for(const name of ['clipboard','account']){$(name+'-panel').hidden=true;$(name+'-toggle').setAttribute('aria-expanded','false');}
  panel=null;if(focus)focusCanvas();scheduleHide();
}
function togglePanel(name){
  if(panel===name){closePanel(true);return;}
  closePanel();panel=name;$(name+'-panel').hidden=false;$(name+'-toggle').setAttribute('aria-expanded','true');revealControls();
  $(name==='clipboard'?'clipboard':'signout').focus();
}
function syncFullscreen(){
  const active=fullscreen();$('fullscreen').textContent=active?'Exit full screen':'Full screen';$('fullscreen').setAttribute('aria-label',active?'Exit full screen':'Enter full screen');$('fullscreen').title=active?'Exit full screen (Esc)':'Enter full screen';
  $('fullscreen').disabled=!document.fullscreenEnabled||!$('workspace').requestFullscreen;
}
$('fullscreen').onclick=()=>{
  // Call directly from the gesture; never request fullscreen after async login.
  const operation=fullscreen()?document.exitFullscreen():$('workspace').requestFullscreen({navigationUI:'hide'});
  operation.catch(()=>status('Full screen is unavailable. The workspace remains usable.',true));
};
document.addEventListener('fullscreenchange',()=>{syncFullscreen();closePanel();if(fullscreen()&&viewerConnected)status('Connected',false);revealControls();focusCanvas();resizeMode();});
$('reveal').onmouseenter=revealControls;
$('reveal').onfocus=()=>{revealControls();$('fullscreen').focus();};
$('reveal').onclick=()=>{revealControls();$('fullscreen').focus();};
$('bar').addEventListener('mouseenter',revealControls);$('bar').addEventListener('mouseleave',scheduleHide);
$('bar').addEventListener('focusin',revealControls);$('bar').addEventListener('focusout',()=>setTimeout(scheduleHide,0));
$('clipboard-toggle').onclick=()=>togglePanel('clipboard');$('account-toggle').onclick=()=>togglePanel('account');
$('clipboard-close').onclick=()=>closePanel(true);$('account-close').onclick=()=>{closePanel();$('account-toggle').focus();};
document.addEventListener('pointerdown',event=>{if(panel&&!$(panel+'-panel').contains(event.target)&&!$(panel+'-toggle').contains(event.target))closePanel();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&panel)closePanel(true);});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&fullscreen()){
    // Preserve the browser escape gesture; don't also cancel a Qt edit/dialog.
    event.stopPropagation();closePanel();document.exitFullscreen().catch(report);
  }
},true);
syncFullscreen();
function resizeMode(current=rfb){
  if(!current)return;
  const {width,height}=$('screen').getBoundingClientRect();
  // Below a usable desktop size, scale the existing framebuffer in full.
  const remote=width>=800&&height>=600;
  if(current.resizeSession!==remote)current.resizeSession=remote;
}
// Install before RFB's own observer, so shrinking below the floor disables
// remote resizing before it can request an unusably small framebuffer.
const resizeObserver=new ResizeObserver(()=>resizeMode());resizeObserver.observe($('screen'));
addEventListener('resize',()=>resizeMode());
function disconnect(){viewerConnected=false;$('start').hidden=false;$('clipboard-toggle').disabled=true;if(rfb){const old=rfb;rfb=null;old.disconnect();}connectedGeneration=null;closePanel();revealControls();}
function report(error){if(!(error instanceof ObsoleteRequest)&&!(error instanceof LoginExpired)&&!signingOut)status(error.message,true);}
async function api(method='GET',path='/session',body){
  const startedAt=revision;
  const headers={};if(method!=='GET'){headers['X-Swag-CSRF']=session?.csrf_token||'';headers['Content-Type']='application/json';}
  const response=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),redirect:'error',cache:'no-store'});
  if(startedAt!==revision)throw new ObsoleteRequest();
  if(response.status===401){stopped=true;disconnect();status('Login expired. Sign in again.');$('start').textContent='Sign in';$('start').disabled=false;throw new LoginExpired();}
  if(!response.ok)throw new Error(`Request failed (${response.status})`);
  const result=await response.json();
  if(startedAt!==revision)throw new ObsoleteRequest();
  return result;
}
function attach(){
  if(stopped||rfb||session?.state!=='running')return;
  $('empty')?.remove();connectedGeneration=session.generation;
  const socket=`${location.protocol==='https:'?'wss':'ws'}://${location.host}/viewer/${encodeURIComponent(session.generation)}/websockify`;
  const current=rfb=new RFB($('screen'),socket,{shared:true});current.scaleViewport=true;resizeMode(current);
  current.addEventListener('connect',()=>{if(rfb===current){viewerConnected=true;$('clipboard-toggle').disabled=false;status('Connected',false);show();scheduleHide();}});
  current.addEventListener('disconnect',()=>{if(rfb===current){rfb=null;viewerConnected=false;$('clipboard-toggle').disabled=true;closePanel();status('Viewer disconnected. Rejoin to take control.');$('start').hidden=false;$('start').textContent='Rejoin workspace';$('start').disabled=false;}});
  current.addEventListener('clipboard',event=>{$('clipboard').value=event.detail.text;});
}
function show(){
  $('user').textContent=session.user;
  $('start').hidden=viewerConnected&&session.state==='running';
  if(session.state==='running'){
    if(!rfb){$('start').textContent='Rejoin workspace';$('start').disabled=false;}
    else{$('start').textContent='Workspace running';$('start').disabled=true;}
  }else if(session.state==='starting'){
    status('Starting workspace…');$('start').disabled=true;
  }else{
    disconnect();status(session.state==='ended'?'Workspace ended. Start explicitly to open another.':'Ready to start your workspace.');
    $('start').textContent='Start workspace';$('start').disabled=false;
  }
}
function acceptSession(next){
  const recovered=stopped;
  const changed=session&&(session.user!==next.user||session.generation!==next.generation);
  if(changed)disconnect();
  session=next;stopped=false;show();
  if((recovered||changed)&&session.state==='running'&&!rfb)status('Workspace running. Rejoin to take control.');
}
async function refreshSession(){
  if(signingOut||busy||polling)return;
  polling=true;
  try{acceptSession(await api());}catch(error){report(error);}finally{polling=false;}
}
$('start').onclick=async()=>{
  if(stopped){location.href=loginURL;return;}if(busy||signingOut)return;busy=true;revision++;$('start').disabled=true;
  try{acceptSession(await api('POST'));attach();}catch(error){report(error);$('start').disabled=false;}finally{busy=false;}
};
$('paste').onclick=()=>{rfb?.clipboardPasteFrom($('clipboard').value);closePanel(true);};
$('signout').onclick=async()=>{
  if(busy||signingOut)return;busy=true;signingOut=true;revision++;disconnect();$('start').hidden=false;status('Signing out…');
  try{await api('DELETE');stopped=true;disconnect();location.href='/oauth2/sign_out?rd=/signed-out';}
  catch(error){signingOut=false;busy=false;report(error);}
};
// A page restored from browser history must revalidate its login and CSRF state.
addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
addEventListener('focus',()=>{if(stopped)void refreshSession();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stopped)void refreshSession();});
try{acceptSession(await api());attach();}catch(error){report(error);}
// Continue checking after a 401: another tab may have completed login meanwhile.
setInterval(refreshSession,3000);
setInterval(async()=>{
  if(stopped||signingOut||!rfb||!connectedGeneration)return;
  try{await api('POST','/session/lease',{generation:connectedGeneration});}catch(error){if(error instanceof ObsoleteRequest)return;disconnect();report(error);}
},10000);
</script></body></html>
