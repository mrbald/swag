<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>swag rendering probe</title>
  <style>
    body { margin: 0; background: #eee; color: #18212c; font: 14px system-ui, sans-serif; }
    header, footer { padding: 8px 12px; }
    header { display: flex; gap: 16px; align-items: center; }
    #screen { width: 1280px; height: 800px; background: #222; }
    footer { display: flex; gap: 12px; align-items: end; }
    label { display: flex; flex-direction: column; gap: 4px; }
    textarea { width: 380px; height: 55px; font: 13px monospace; }
    button { padding: 6px 12px; }
    #status { font-weight: 600; }
    #clipboard-error { color: #9b1c1c; max-width: 220px; }
    .note { color: #555; }
  </style>
</head>
<body>
  <header>
    <strong>swag rendering probe</strong>
    <span id="status">Connecting</span>
    <button id="disconnect" type="button">Disconnect viewer</button>
    <span class="note">Private test frontend — no authentication</span>
  </header>
  <main id="screen" aria-label="Remote Qt application"></main>
  <footer>
    <label>Send clipboard text to Qt
      <textarea id="clipboard-input" aria-label="Send clipboard text to Qt"></textarea>
    </label>
    <button id="send-clipboard" type="button">Send clipboard</button>
    <p id="clipboard-error" role="alert" hidden></p>
    <label>Clipboard received from Qt
      <textarea id="clipboard-output" aria-label="Clipboard received from Qt" readonly></textarea>
    </label>
  </footer>
  <script type="module">
    import RFB from './core/rfb.js';
    import Deflator from './core/deflator.js';
    import {encodeUTF8} from './core/util/strings.js';
    import {preflightClipboard} from './clipboard.js';
    const status = document.querySelector('#status');
    const clipboardInput = document.querySelector('#clipboard-input');
    const clipboardError = document.querySelector('#clipboard-error');
    function clearClipboardError() {
      clipboardError.hidden = true;
      clipboardError.textContent = '';
      clipboardInput.removeAttribute('aria-invalid');
      clipboardInput.removeAttribute('aria-describedby');
    }
    clipboardInput.addEventListener('input', clearClipboardError);
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsPort = new URLSearchParams(location.search).get('wsPort');
    if (wsPort && (!/^\d+$/.test(wsPort) || Number(wsPort) < 1 || Number(wsPort) > 65535))
      throw new Error('Invalid WebSocket port');
    const wsHost = wsPort ? `${location.hostname}:${wsPort}` : location.host;
    const rfb = new RFB(document.querySelector('#screen'), `${protocol}//${wsHost}/websockify`);
    rfb.scaleViewport = false;
    rfb.resizeSession = false;
    rfb.viewOnly = false;
    rfb.addEventListener('connect', () => { status.textContent = 'Connected'; });
    rfb.addEventListener('disconnect', event => {
      status.textContent = event.detail.clean ? 'Disconnected' : 'Connection lost';
    });
    rfb.addEventListener('securityfailure', () => { status.textContent = 'Authentication failed'; });
    rfb.addEventListener('clipboard', event => {
      document.querySelector('#clipboard-output').value = event.detail.text;
    });
    document.querySelector('#send-clipboard').addEventListener('click', () => {
      const result = preflightClipboard(clipboardInput.value, encodeUTF8, data => new Deflator().deflate(data));
      if (!result.ok) {
        clipboardError.textContent = result.error;
        clipboardError.hidden = false;
        clipboardInput.setAttribute('aria-invalid', 'true');
        clipboardInput.setAttribute('aria-describedby', 'clipboard-error');
        clipboardInput.focus();
        return;
      }
      clearClipboardError();
      rfb.clipboardPasteFrom(clipboardInput.value);
    });
    document.querySelector('#disconnect').addEventListener('click', () => { rfb.disconnect(); });
  </script>
</body>
</html>
